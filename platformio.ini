; Светомузыка на Arduino - сборка через PlatformIO
; Сборка:   pio run                  (плата по умолчанию - Nano)
; Прошивка: pio run -e nano -t upload
; Монитор:  pio device monitor
;
; Скетч остаётся в папке firmware/ и по-прежнему открывается в Arduino IDE.

[platformio]
src_dir = firmware/colorMusic_v3.0
lib_dir = libraries
default_envs = nano

[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600

; Arduino Nano с новым загрузчиком (оригинальные и свежие клоны)
[env:nano]
board = nanoatmega328new

; Arduino Nano со старым загрузчиком (если "nano" не прошивается)
[env:nano_old]
board = nanoatmega328

[env:uno]
board = uno

[env:mega]
board = megaatmega2560

[env:promicro]
board = sparkfun_promicro16
